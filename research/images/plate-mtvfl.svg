<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-label="A vertical pipe carrying churn flow: irregular gas structures rising through liquid, with the Euler characteristic traced beside it"><rect data-bg="paper" width="100%" height="100%" fill="#f5efde" />
  <defs><style>
    .frame       { stroke: #2b211a; fill: none; stroke-width: 0.6; opacity: 0.4; }
    .ink         { stroke: #2b211a; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .hair        { stroke: #2b211a; fill: none; stroke-width: 0.55; opacity: 0.55; }
    .gas         { fill: #2b211a; stroke: none; opacity: 0.82; }
    .trace       { stroke: #2b211a; fill: none; stroke-width: 1.0; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
    .label-math  { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 20px; fill: #2b211a; opacity: 0.9; }
    .small-label { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: #2b211a; opacity: 0.7; }
  </style></defs>

  <rect class="frame" x="6"  y="6"  width="268" height="268" stroke-width="1.4" opacity="0.6" />
  <rect class="frame" x="11" y="11" width="258" height="258" stroke-width="0.5" opacity="0.4" />

  <!-- PIPE WALLS -->
  <g class="ink">
    <line x1="58" y1="30" x2="58" y2="250" />
    <line x1="128" y1="30" x2="128" y2="250" />
  </g>
  <!-- wall hatching, outer -->
  <g class="hair">
    <line x1="52" y1="34" x2="58" y2="40" /><line x1="52" y1="54" x2="58" y2="60" />
    <line x1="52" y1="74" x2="58" y2="80" /><line x1="52" y1="94" x2="58" y2="100" />
    <line x1="52" y1="114" x2="58" y2="120" /><line x1="52" y1="134" x2="58" y2="140" />
    <line x1="52" y1="154" x2="58" y2="160" /><line x1="52" y1="174" x2="58" y2="180" />
    <line x1="52" y1="194" x2="58" y2="200" /><line x1="52" y1="214" x2="58" y2="220" />
    <line x1="52" y1="234" x2="58" y2="240" />
    <line x1="128" y1="40" x2="134" y2="34" /><line x1="128" y1="60" x2="134" y2="54" />
    <line x1="128" y1="80" x2="134" y2="74" /><line x1="128" y1="100" x2="134" y2="94" />
    <line x1="128" y1="120" x2="134" y2="114" /><line x1="128" y1="140" x2="134" y2="134" />
    <line x1="128" y1="160" x2="134" y2="154" /><line x1="128" y1="180" x2="134" y2="174" />
    <line x1="128" y1="200" x2="134" y2="194" /><line x1="128" y1="220" x2="134" y2="214" />
    <line x1="128" y1="240" x2="134" y2="234" />
  </g>

  <!-- CHURN: irregular, merging and splitting gas structures -->
  <g class="gas">
    <path d="M 74 236 q 10 -14 22 -6 q 12 8 20 -4 q -4 18 -20 16 q -16 -2 -22 -6 z" />
    <ellipse cx="88" cy="206" rx="19" ry="11" />
    <ellipse cx="112" cy="192" rx="7" ry="5" />
    <path d="M 70 176 q 14 -18 30 -8 q 16 10 24 -2 q -2 22 -24 20 q -22 -2 -30 -10 z" />
    <ellipse cx="80" cy="146" rx="13" ry="8" />
    <ellipse cx="108" cy="150" rx="9" ry="6" />
    <ellipse cx="94" cy="128" rx="6" ry="4" />
    <path d="M 66 108 q 16 -20 34 -10 q 18 10 26 -4 q 0 24 -26 22 q -26 -2 -34 -8 z" />
    <ellipse cx="86" cy="80" rx="16" ry="9" />
    <ellipse cx="112" cy="70" rx="6" ry="4" />
    <ellipse cx="76" cy="56" rx="8" ry="5" />
    <ellipse cx="100" cy="46" rx="11" ry="6" />
  </g>

  <!-- FLOW DIRECTION -->
  <g class="ink">
    <line x1="93" y1="266" x2="93" y2="256" />
    <path d="M 89 260 L 93 254 L 97 260" />
  </g>

  <!-- CHI TRACE, oscillating alongside -->
  <g class="trace">
    <path d="M 168 246 L 174 226 L 180 240 L 187 212 L 193 232 L 200 196
             L 206 220 L 213 182 L 219 206 L 226 166 L 232 192 L 239 150
             L 245 178 L 251 138" />
  </g>
  <g class="hair">
    <line x1="160" y1="252" x2="160" y2="132" />
    <line x1="160" y1="252" x2="256" y2="252" />
  </g>
  <text class="label-math" x="144" y="128">&#967;</text>
  <text class="small-label" x="196" y="258">time</text>
  <text class="small-label" x="62" y="30">churn</text>
</svg>
