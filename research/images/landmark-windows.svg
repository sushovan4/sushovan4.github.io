<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" role="img" aria-label="Landmark windows tiling the birth–death plane; a few diagram points, each linked to the landmark whose window contains it.">
<rect data-bg="paper" width="100%" height="100%" fill="#f5efde" />
<defs><style>
  .v  { fill: #2b211a; }
  .o  { fill: #f5efde; stroke: #2b211a; stroke-width: 1; }
  .ax { stroke: #2b211a; fill: none; stroke-width: 1.1; }
  .dg { stroke: #2b211a; stroke-width: 0.7; stroke-dasharray: 3 2; opacity: 0.55; }
  .win { fill: #2b211a; fill-opacity: 0.05; stroke: #2b211a; stroke-width: 0.7; stroke-opacity: 0.55; }
  .winon { fill: #2b211a; fill-opacity: 0.13; stroke: #2b211a; stroke-width: 1.2; }
  .lm { fill: none; stroke: #2b211a; stroke-width: 1.3; }
  .as { stroke: #2b211a; stroke-width: 0.8; stroke-dasharray: 2 2; opacity: 0.8; }
  .panel { fill: none; stroke: #2b211a; stroke-width: 0.6; opacity: 0.35; }
  .frame { stroke: #2b211a; fill: none; }
  .lab { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 12px; fill: #2b211a; opacity: 0.8; letter-spacing: 0.04em; }
  .sc  { font-family: 'EB Garamond', Georgia, serif; font-size: 10px; fill: #2b211a; opacity: 0.7; letter-spacing: 0.14em; }
</style></defs>
