<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-label="A contamination gradient across survey plots: co-occurrence networks reorganize abruptly at a threshold while abundances change smoothly"><rect data-bg="paper" width="100%" height="100%" fill="#f5efde" />
  <defs><style>
    .frame       { stroke: #2b211a; fill: none; stroke-width: 0.6; opacity: 0.4; }
    .ink         { stroke: #2b211a; fill: none; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .hair        { stroke: #2b211a; fill: none; stroke-width: 0.5; opacity: 0.5; }
    .edge        { stroke: #2b211a; fill: none; stroke-width: 0.7; opacity: 0.8; }
    .vertex      { fill: #2b211a; stroke: none; }
    .cut         { stroke: #2b211a; fill: none; stroke-width: 1.1; stroke-dasharray: 4 3; opacity: 0.85; }
    .label-math  { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 19px; fill: #2b211a; opacity: 0.9; }
    .small-label { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11.5px; fill: #2b211a; opacity: 0.7; }
    .panel-label { font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 11px; fill: #2b211a; opacity: 0.75; letter-spacing: 0.05em; }
  </style></defs>

  <rect class="frame" x="6"  y="6"  width="268" height="268" stroke-width="1.4" opacity="0.6" />
  <rect class="frame" x="11" y="11" width="258" height="258" stroke-width="0.5" opacity="0.4" />

  <!-- GRADIENT AXIS -->
  <g class="hair">
    <line x1="30" y1="232" x2="252" y2="232" />
    <line x1="30" y1="232" x2="30" y2="52" />
  </g>
  <text class="label-math" x="20" y="46">&#967;</text>

  <!-- THREE COMMUNITIES: connected, loosening, fragmented -->
  <!-- plot A: densely co-occurring -->
  <g transform="translate(58,96)">
    <g class="edge">
      <line x1="0" y1="-14" x2="13" y2="6" /><line x1="0" y1="-14" x2="-13" y2="6" />
      <line x1="13" y1="6" x2="-13" y2="6" /><line x1="0" y1="-14" x2="0" y2="14" />
      <line x1="13" y1="6" x2="0" y2="14" /><line x1="-13" y1="6" x2="0" y2="14" />
    </g>
    <g class="vertex">
      <circle cx="0" cy="-14" r="2.6" /><circle cx="13" cy="6" r="2.6" />
      <circle cx="-13" cy="6" r="2.6" /><circle cx="0" cy="14" r="2.6" />
    </g>
  </g>
  <!-- plot B: one loop opens -->
  <g transform="translate(140,96)">
    <g class="edge">
      <line x1="0" y1="-14" x2="13" y2="6" />
      <line x1="13" y1="6" x2="-13" y2="6" />
      <line x1="-13" y1="6" x2="0" y2="-14" />
      <line x1="13" y1="6" x2="0" y2="14" />
    </g>
    <g class="vertex">
      <circle cx="0" cy="-14" r="2.6" /><circle cx="13" cy="6" r="2.6" />
      <circle cx="-13" cy="6" r="2.6" /><circle cx="0" cy="14" r="2.6" />
    </g>
  </g>
  <!-- plot C: fragmented -->
  <g transform="translate(222,96)">
    <g class="edge">
      <line x1="-13" y1="6" x2="0" y2="14" />
    </g>
    <g class="vertex">
      <circle cx="0" cy="-14" r="2.6" /><circle cx="13" cy="6" r="2.6" />
      <circle cx="-13" cy="6" r="2.6" /><circle cx="0" cy="14" r="2.6" />
    </g>
  </g>

  <!-- ABUNDANCE: smooth, uninformative decline -->
  <g class="hair">
    <path d="M 34 158 Q 100 164 140 172 Q 190 182 248 192" />
  </g>

  <!-- CHI: flat, then a step at the threshold -->
  <g class="ink">
    <path d="M 34 204 L 60 203 L 86 205 L 112 203 L 138 204" />
    <path d="M 142 204 L 146 186 L 150 172" />
    <path d="M 152 172 L 178 171 L 204 173 L 230 171 L 250 172" />
  </g>

  <!-- THRESHOLD -->
  <g class="cut">
    <line x1="145" y1="62" x2="145" y2="226" />
  </g>
  <text class="small-label" x="106" y="58">threshold</text>
  <text class="panel-label" x="20" y="255">PLOTS &#183; CO-OCCURRENCE &#183; THRESHOLD</text>
</svg>
